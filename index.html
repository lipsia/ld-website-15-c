<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/ld-logo.svg" />
    <!--
      Both faces are on the critical path: Rubik sets every heading, Plex Mono the
      spec line under the mark, and the hero pixel mosaic cannot rasterise until
      Rubik resolves. Preloading collapses the CSS -> @font-face -> download chain
      into one round trip. `crossorigin` is required even same-origin, because fonts
      are always fetched in CORS mode — omit it and the browser fills a second,
      unusable cache entry and downloads the file twice. The latin-ext files are
      deliberately not preloaded: unicode-range keeps them unfetched for our copy.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/rubik-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/ibm-plex-mono-400-latin.woff2"
      crossorigin
    />
    <meta name="theme-color" content="#05040f" />
    <!--
      Baseline CSP. `public/_headers` ships the authoritative policy at the edge;
      this meta tag keeps the guarantee intact for plain static hosting.
      style-src allows 'unsafe-inline' because React/R3F inject style
      attributes for layout; script-src does NOT allow unsafe-inline/eval.
      frame-ancestors is deliberately absent here — it is ignored when delivered
      via meta (and warns on every load); _headers carries it, plus X-Frame-Options.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Lipsia Digital — We bring visions to life</title>
    <meta
      name="description"
      content="Successfully implement transformations and shape the future with digital solutions. Software Engineering, Information Systems and Digital Products from Leipzig."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
